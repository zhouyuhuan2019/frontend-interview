    - 闭包陷阱与 useRef
    - 性能优化
    - Fiber 与调和
    - 与 Vue 的对比

- id: engineering
  title: 工程化与性能
  order: 70
  desc: 构建工具、模块化、性能优化、监控
  subtopics:
    - 构建工具与 HMR
